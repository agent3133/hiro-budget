# Development use only (e.g. `uv run alembic revision --autogenerate -m "..."`).
# The application migrates its database automatically on startup.
[alembic]
script_location = src/hiro_budget/db/migrations
sqlalchemy.url = sqlite:///data/dev_migrations.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
