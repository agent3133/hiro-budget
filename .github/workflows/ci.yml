name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests packaging scripts demo
          uv run ruff format --check src tests packaging scripts demo
      - name: Tests (GUI tests run headless)
        run: uv run pytest -q
