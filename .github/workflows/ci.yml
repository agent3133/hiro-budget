name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests packaging demo
          uv run ruff format --check src tests packaging demo
      - name: Type check (services, importers, db, config; see [tool.mypy])
        run: uv run mypy
      - name: Tests (GUI tests run headless)
        run: uv run pytest -q
      - name: Known vulnerabilities in the runtime dependencies
        shell: bash
        run: |
          uv export --no-default-groups --no-hashes --no-emit-project --format requirements-txt -o runtime.txt
          uvx pip-audit -r runtime.txt --progress-spinner off
