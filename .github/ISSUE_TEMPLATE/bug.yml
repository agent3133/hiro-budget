name: Bug
description: Something does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: With the demo (`Start demo.cmd` / `hiro-budget demo`) if possible.
  - type: input
    id: version
    attributes:
      label: Version and how you run it
      placeholder: e.g. 0.1.0, exe on Windows 11 / from source with uv
  - type: textarea
    id: log
    attributes:
      label: Error message or log
      description: No personal data (names, IBANs, amounts of your bookings).
      render: text
