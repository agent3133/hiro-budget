[project]
name = "hiro-budget"
version = "0.3.0"
description = "Hiro Budget: a local family budget (YNAB-style): import bank statements, categorize, report"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fints>=5.0.1",
    "numpy>=2.3",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2",
    "pyside6>=6.12.0",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2",
]

[project.scripts]
hiro-budget = "hiro_budget.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hiro_budget"]

# the user guide (Help > User guide) ships with the package
[tool.hatch.build.targets.wheel.force-include]
"docs/workflows.de.md" = "hiro_budget/guide/workflows.de.md"
"docs/workflows.en.md" = "hiro_budget/guide/workflows.en.md"
"docs/csv-import.de.md" = "hiro_budget/guide/csv-import.de.md"
"docs/csv-import.en.md" = "hiro_budget/guide/csv-import.en.md"
"docs/csv-formats.llm.md" = "hiro_budget/guide/csv-formats.llm.md"
"docs/images/workflows" = "hiro_budget/guide/images/workflows"  # its screenshots

[dependency-groups]
build = [
    "nuitka>=4.3.1",
]
demo = [
    "faker>=40.43.0",
]
dev = [
    "fpdf2>=2.8.9",
    "mcp>=2.3.0",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.17.1",
]

[tool.uv]
default-groups = ["dev", "demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["incremental: ordered steps of a scenario; a failing step skips the rest"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["src/hiro_budget/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
# Type checking of the layers without Qt (#80); the GUI is not checked (Qt's Optional returns).
files = ["src/hiro_budget/services", "src/hiro_budget/importers", "src/hiro_budget/db", "src/hiro_budget/config.py", "src/hiro_budget/plugins", "src/hiro_budget/plugin_api.py", "src/hiro_budget/ops"]
plugins = ["pydantic.mypy"]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
