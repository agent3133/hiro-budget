# Category structure. Copied to categories.yaml on first run.
# Keys are stable identifiers (group.category) referenced by rules and stored in the database.
# Renaming a category: change `name`, keep `key`. Removing one hides it (history is kept).

groups:
  - key: wohnen
    name: Wohnen
    categories:
      - {key: baufinanzierung, name: Baufinanzierung}
      - {key: nebenkosten, name: Nebenkosten/Hausgeld}
      - {key: energie, name: Energie/Wasser}
